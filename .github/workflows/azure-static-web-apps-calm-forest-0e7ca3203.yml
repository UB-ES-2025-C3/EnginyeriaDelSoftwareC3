name: Frontend CI/CD + PRE/PROD

# --- TRIGGERS WORKFLOWS ---
on:
  push:
    branches:
      - pre_deploy # Executa quan es fa push a pre_deploy
  pull_request:     # <--- Afegeix aquest bloc
    branches:
      - pre_deploy  # S'executa quan obres una PR que apunta CAP a pre_deploy
  workflow_dispatch: # Permet executar-ho manualment des de la web de GitHub

jobs:
  # --- Primer de tot executar els tests ---
  test-frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # Ens situem a la carpeta del frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Baixa el codi del repositori

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for e2e tests
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run Cypress E2E tests
        run: npm run e2e:ci

  # TESTS BACKEND
  test-backend:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json 

      - name: Install backend dependencies
        run: npm ci

      - name: Executar tests backend
        run: npm test
        env:
          MONGO_URI: ${{ secrets.MONGO_URI_TEST }}

  # --- Si passen els tests, fer build i pre_deploy o deploy del frontend ---
  build_and_deploy_job:
    name: Build i deploy frontend a Staging
    runs-on: ubuntu-latest
    needs: 
        - test-frontend
        - test-backend
    if: github.ref != 'refs/heads/dev'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        id: idtoken
        uses: actions/github-script@v6
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      # --- Si estem a la branca 'pre_deploy' (Staging) ---
      - name: Build And Deploy to Staging
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FOREST_0E7CA3203 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./frontend" # App source code path
          api_location: "https://predeploybackend-dqcacqh6fbgbfeeh.francecentral-01.azurewebsites.net" # Api source code path - optional
          app_build_command: "npm run build -- --mode predeploy"
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FOREST_0E7CA3203 }}
          app_location: "./frontend"
          action: "close"
