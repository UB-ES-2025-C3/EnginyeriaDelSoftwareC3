name: Frontend CI/CD + PROD

# --- TRIGGERS WORKFLOWS ---
on:
  push:
    branches:
      - deploy              # Ejecuta cuando se hace push a deploy
  pull_request:
    branches:
      - deploy              # Ejecuta en PRs hacia deploy
  workflow_dispatch:        # Permite ejecutarlo manualmente desde GitHub

jobs:
  # --- TESTS FRONTEND ---
  test-frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for e2e tests
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend end-to-end tests
        run: npm run test:e2e

  # --- TESTS BACKEND ---
  test-backend:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
        env:
          MONGO_URI: ${{ secrets.MONGO_URI_TEST }}

  # --- BUILD + DEPLOY FRONTEND ---
  build_and_deploy_job:
    name: Build i deploy frontend a Production
    runs-on: ubuntu-latest
    needs:
      - test-frontend
      - test-backend
    if: github.ref == 'refs/heads/deploy'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BAY_0F8F41603 }}
          action: "upload"
          # Configuración del proyecto
          app_location: "./frontend"
          api_location: ""                       # No usamos Functions, backend va aparte en App Service
          app_build_command: "npm run build -- --mode production"
          output_location: "dist"

  # --- CIERRE DE PULL REQUEST ---
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BAY_0F8F41603 }}
          action: "close"
          app_location: "./frontend"
          output_location: "dist"
