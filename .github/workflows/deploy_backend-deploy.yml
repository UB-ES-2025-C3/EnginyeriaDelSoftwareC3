name: Backend CI/CD + PROD

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  # --- Primer de tot executar els tests ---
  test-frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # Ens situem a la carpeta del frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Baixa el codi del repositori

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for e2e tests
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend end-to-end tests
        run: npm run test:e2e

  # TESTS BACKEND
  test-backend:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json 

      - name: Install backend dependencies
        run: npm ci
              
      - name: Wait for 1 minute # Esperar que els tests del workflow del frontend hagin acabat per no tenir concurrència a la BBDD
        run: sleep 60s

      - name: Executar tests backend
        run: npm test
        env:
          MONGO_URI: ${{ secrets.MONGO_URI_TEST }}

  deploy-backend-prod:
    name: Deploy backend a Azure (PROD)
    runs-on: ubuntu-latest
    needs: 
      - test-frontend
      - test-backend
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

          
      - name: Install backend dependencies
        run: npm ci

      - name: Build backend (opcional)
        run: npm run build --if-present

      - name: Crear paquet ZIP del backend
        run: |
          zip -r backend.zip . -x "*.git*" ".git/**"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EA6D114EDAEE4CC698C7AFD315D5CCA8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_84DEA0B308AA44DDA638C27053ED0303 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E5E2234B523643B4A35A0F06F25CA9EB }}

      - name: Deploy to Azure Web App (PROD backend)
        uses: azure/webapps-deploy@v3
        with:
          app-name: backend-deploy
          slot-name: Production
          package: backend/backend.zip
