name: Frontend CI/CD

# --- TRIGGERS WORKFLOWS ---
on:
  push:
    branches:
      - dev # Executa quan es fa push a dev
      - pre_deploy # Executa quan es fa push a pre_deploy
      - deploy # Executa quan es fa push a deploy
  workflow_dispatch: # Permet executar-ho manualment des de la web de GitHub

jobs:
  # --- Primer de tot executar els tests ---
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit

  # --- JOB 2: BUILD & DEPLOY ---
  deploy:
    runs-on: ubuntu-latest
    needs: test-frontend
    # Només executem si estem a pre_deploy (Staging) o deploy (Prod)
    if: github.ref == 'refs/heads/pre_deploy' || github.ref == 'refs/heads/deploy'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # Construïm l'app manualment i li passem la URL del backend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          # Fem servir el secret VITE_API_URL que ja tens creat
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Desplegament a STAGING (pre_deploy)
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/pre_deploy'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FOREST_0E7CA3203 }}
          action: upload
          app_location: ./frontend
          output_location: dist
          api_location: ""
          skip_app_build: true # Saltem la build d'Azure perquè ja l'hem feta nosaltres

      # Desplegament a PRODUCCIÓ (deploy)
      - name: Deploy to Production
        if: github.ref == 'refs/heads/deploy'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BAY_0F8F41603 }}
          action: upload
          app_location: ./frontend
          output_location: dist
          api_location: ""
          skip_app_build: true