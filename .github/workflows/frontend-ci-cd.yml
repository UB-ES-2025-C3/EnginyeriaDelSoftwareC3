name: Frontend CI/CD

# --- TRIGGERS WORKFLOWS ---
on:
  push:
    branches:
      - dev # Executa quan es fa push a dev
      - pre_deploy # Executa quan es fa push a pre_deploy
      - deploy # Executa quan es fa push a deploy
  workflow_dispatch: # Permet executar-ho manualment des de la web de GitHub

jobs:
  # --- Primer de tot executar els tests ---
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit

  # --- Si passen els tests, fer build i pre_deploy o deploy del frontend ---
  build_and_deploy_job:
    runs-on: ubuntu-latest
    needs: test-frontend
    # No executem deploy/pre_deploy si és la branca dev (només tests)
    if: github.ref != 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # --- Si estem a la branca 'pre_deploy' (Staging) ---
      - name: Build And Deploy to Staging
        if: github.ref == 'refs/heads/pre_deploy'
        id: builddeploy-staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FOREST_0E7CA3203 }}
          action: upload
          app_location: ./frontend
          api_location: ""
          output_location: dist

      # --- Si estem a la branca 'deploy' (Production) ---
      - name: Build And Deploy to Production
        if: github.ref == 'refs/heads/deploy'
        id: builddeploy-prod
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BAY_0F8F41603 }}
          action: upload
          app_location: ./frontend
          api_location: ""
          output_location: dist
