name: Frontend CI/CD

# --- TRIGGERS WORKFLOWS ---
on:
  push:
    branches:
      - dev
      - pre_deploy
      - deploy
  workflow_dispatch:

jobs:
  # --- JOB 1: TESTS ---
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit

  # --- JOB 2: BUILD & DEPLOY ---
  deploy:
    runs-on: ubuntu-latest
    needs: test-frontend
    # Només executem si és una branca de desplegament
    if: github.ref == 'refs/heads/pre_deploy' || github.ref == 'refs/heads/deploy'
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # --- PAS 2: BUILD MANUAL (Per injectar la URL del Backend) ---
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # --- PAS 3: DESPLEGAMENT A STAGING ---
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/pre_deploy'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FOREST_0E7CA3203 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: upload
          app_location: ./frontend
          output_location: dist
          api_location: ""
          skip_app_build: true # Saltem la build d'Azure

      # --- PAS 4: DESPLEGAMENT A PRODUCCIÓ ---
      - name: Deploy to Production
        if: github.ref == 'refs/heads/deploy'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BAY_0F8F41603 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: upload
          app_location: ./frontend
          output_location: dist
          api_location: ""
          skip_app_build: true # Saltem la build d'Azure
          