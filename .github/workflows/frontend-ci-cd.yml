name: Frontend CI/CD

# --- TRIGGERS WORKFLOWS ---
on:
  push:
    branches:
      - dev # Executa quan es fa push a dev
      - pre_deploy # Executa quan es fa push a pre_deploy
      - deploy # Executa quan es fa push a deploy
  workflow_dispatch: # Permet executar-ho manualment des de la web de GitHub

jobs:
  # --- Primer de tot executar els tests ---
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # Ens situem a la carpeta del frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Baixa el codi del repositori

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit

  # --- Si passen els tests, fer build i pre_deploy o deploy del frontend ---
  build_and_deploy_job:
    runs-on: ubuntu-latest
    needs: test-frontend
    if: github.ref != 'refs/heads/dev'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        id: idtoken
        uses: actions/github-script@v6
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      # --- Si estem a la branca 'pre_deploy' (Staging) ---
      - name: Build And Deploy to Staging
        if: github.ref == 'refs/heads/pre_deploy'
        id: builddeploy-staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FOREST_0E7CA3203 }}
          action: upload
          app_location: ./frontend
          api_location: "https://registre-backend-h6c4eugbgghncyhe.francecentral-01.azurewebsites.net"
          output_location: dist
          github_id_token: ${{ steps.idtoken.outputs.result }}

      # --- Si estem a la branca 'deploy' (Production) ---
      - name: Build And Deploy to Production
        if: github.ref == 'refs/heads/deploy'
        id: builddeploy-prod
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BAY_0F8F41603 }}
          action: upload
          app_location: ./frontend
          api_location: "https://registre-backend-h6c4eugbgghncyhe.francecentral-01.azurewebsites.net"
          output_location: dist
          github_id_token: ${{ steps.idtoken.outputs.result }}
